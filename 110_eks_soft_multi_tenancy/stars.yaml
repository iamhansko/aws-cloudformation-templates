Transform: AWS::LanguageExtensions
Parameters:
  InboundFromAnywhere:
    Type: String
    Default: "False"
    AllowedValues: ["True", "False"]
    Description: SecurityGroup Inbound Rule (Source 0.0.0.0/0)
  KubernetesVersion:
    Description: EKS Cluster Kubernetes Version (1.XX)
    Type: String
    Default: "1.36"
    AllowedValues: ["1.32", "1.33", "1.34", "1.35", "1.36"]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
Conditions:
  SecurityGroupInboundFromAnywhere: !Equals [!Ref InboundFromAnywhere, "True"]

Mappings:
  AzMapping:
    a:
      PublicSubnetCidr: 10.0.0.0/24
      PrivateSubnetCidr: 10.0.1.0/24
    c:
      PublicSubnetCidr: 10.0.4.0/24
      PrivateSubnetCidr: 10.0.5.0/24

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub
        - key-${Id}
        - Id: !Select [3, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: True
      EnableDnsHostnames: True
      Tags:
        - Key: Name
          Value: vpc

  # PublicSubnets
  Fn::ForEach::PublicSubnets:
    - Az
    - [a, c]
    - PublicSubnet${Az}:
        Type: AWS::EC2::Subnet
        Properties:
          AvailabilityZone: !Sub ${AWS::Region}${Az}
          CidrBlock: !FindInMap [AzMapping, !Ref Az, PublicSubnetCidr]
          MapPublicIpOnLaunch: true
          Tags:
            - Key: Name
              Value: !Sub public-subnet-${Az}
          VpcId: !Ref Vpc
      PublicSubnet${Az}RouteTableAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
          RouteTableId: !Ref PublicSubnetRouteTable
          SubnetId:
            Ref: !Sub PublicSubnet${Az}
  PublicSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value: public-rt
      VpcId: !Ref Vpc
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: igw
  VpcInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc
  PublicSubnetRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - VpcInternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicSubnetRouteTable

  # PrivateSubnets
  Fn::ForEach::PrivateSubnets:
    - Az
    - [a, c]
    - PrivateSubnet${Az}:
        Type: AWS::EC2::Subnet
        Properties:
          VpcId: !Ref Vpc
          CidrBlock: !FindInMap [AzMapping, !Ref Az, PrivateSubnetCidr]
          AvailabilityZone: !Sub ${AWS::Region}${Az}
          Tags:
            - Key: Name
              Value: !Sub private-subnet-${Az}
      NatgatewayElasticIp${Az}:
        Type: AWS::EC2::EIP
      PrivateSubnet${Az}RouteTableAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
          RouteTableId: !Ref PrivateSubnetRouteTable
          SubnetId:
            Ref: !Sub PrivateSubnet${Az}
  PrivateSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub private-rt
  PrivateSubnetRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
      RouteTableId: !Ref PrivateSubnetRouteTable
  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - VpcInternetGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      AvailabilityMode: regional
      AvailabilityZoneAddresses:
        - AvailabilityZone: !Sub ${AWS::Region}a
          AllocationIds:
            - !GetAtt NatgatewayElasticIpa.AllocationId
        - AvailabilityZone: !Sub ${AWS::Region}c
          AllocationIds:
            - !GetAtt NatgatewayElasticIpc.AllocationId
      Tags:
        - Key: Name
          Value: !Sub regional-natgw

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Version: !Ref KubernetesVersion
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      BootstrapSelfManagedAddons: false
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        SubnetIds:
          - !Ref PublicSubneta
          - !Ref PublicSubnetc
          - !Ref PrivateSubneta
          - !Ref PrivateSubnetc
      RoleArn: !GetAtt EksClusterIamRole.Arn
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: 172.20.0.0/16
  EksClusterIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  # EksOidcProvider:
  #   Type: AWS::IAM::OIDCProvider
  #   Properties:
  #     Url: !GetAtt EksCluster.OpenIdConnectIssuerUrl
  #     ClientIdList:
  #       - sts.amazonaws.com
  VpcCniAddOn:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: vpc-cni
      ClusterName: !Ref EksCluster
      ConfigurationValues: | # Network Isolation between Tenants (A | B)
        enableNetworkPolicy: "true" 
  KubeProxyAddOn:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: kube-proxy
      ClusterName: !Ref EksCluster
  CoreDnsAddOn:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: coredns
      ClusterName: !Ref EksCluster
  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: eks-pod-identity-agent
      ClusterName: !Ref EksCluster
  CoreNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      NodegroupName: core-nodegroup
      AmiType: AL2023_x86_64_STANDARD
      InstanceTypes:
        - t3.medium
      CapacityType: ON_DEMAND
      ClusterName: !Ref EksCluster
      ForceUpdateEnabled: true
      NodeRole: !GetAtt EksNodeIamRole.Arn
      ScalingConfig:
        DesiredSize: 2
        MaxSize: 4
        MinSize: 2
      Subnets:
        - !Ref PrivateSubneta
        - !Ref PrivateSubnetc
  EksNodeIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  TenantARole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tenant-a-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - sts:AssumeRole
  TenantAAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EksCluster
      PrincipalArn: !GetAtt TenantARole.Arn
      Type: STANDARD
      AccessPolicies:
        - AccessScope:
            Type: namespace
            Namespaces:
              - tenant-a
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
  TenantBRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tenant-b-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - sts:AssumeRole
  TenantBAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EksCluster
      PrincipalArn: !GetAtt TenantBRole.Arn
      Type: STANDARD
      AccessPolicies:
        - AccessScope:
            Type: namespace
            Namespaces:
              - tenant-b
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy

  ManagementUiNlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internet-facing
      SecurityGroups:
        - !GetAtt Vpc.DefaultSecurityGroup # Ignored
      Subnets:
        - !Ref PublicSubneta
        - !Ref PublicSubnetc
      Tags:
        - Key: elbv2.k8s.aws/cluster
          Value: !Ref EksCluster
        - Key: service.k8s.aws/resource
          Value: LoadBalancer
        - Key: service.k8s.aws/stack
          Value: management-ui/management-ui
  NlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group
      GroupName: nlb-sg
      SecurityGroupIngress:
        - !If [SecurityGroupInboundFromAnywhere, {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          }, !Ref AWS::NoValue]
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: nlb-sg
  AwsLoadBalancerControllerRole:
    # https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/refs/heads/main/docs/install/iam_policy.json
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: AWSLoadBalancerControllerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "iam:CreateServiceLinkedRole"
                Resource: "*"
                Condition:
                  StringEquals:
                    "iam:AWSServiceName": "elasticloadbalancing.amazonaws.com"
              - Effect: "Allow"
                Action:
                  - "ec2:*"
                  - "elasticloadbalancing:*"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  - "cognito-idp:DescribeUserPoolClient"
                  - "acm:ListCertificates"
                  - "acm:DescribeCertificate"
                  - "iam:ListServerCertificates"
                  - "iam:GetServerCertificate"
                  - "waf-regional:GetWebACL"
                  - "waf-regional:GetWebACLForResource"
                  - "waf-regional:AssociateWebACL"
                  - "waf-regional:DisassociateWebACL"
                  - "wafv2:GetWebACL"
                  - "wafv2:GetWebACLForResource"
                  - "wafv2:AssociateWebACL"
                  - "wafv2:DisassociateWebACL"
                  - "shield:GetSubscriptionState"
                  - "shield:DescribeProtection"
                  - "shield:CreateProtection"
                  - "shield:DeleteProtection"
                Resource: "*"
  AwsLoadBalancerControllerRolePodIdentityAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      RoleArn: !GetAtt AwsLoadBalancerControllerRole.Arn
      ServiceAccount: aws-load-balancer-controller

  VsCodeEc2:
    Type: AWS::EC2::Instance
    DependsOn:
      - CoreNodeGroup
    CreationPolicy:
      ResourceSignal:
        Count: '1'
        Timeout: PT15M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.medium
      KeyName: !Ref KeyPair
      NetworkInterfaces:
        - AssociatePublicIpAddress: True
          DeviceIndex: 0
          SubnetId: !Ref PublicSubneta
          GroupSet:
            - !GetAtt EksCluster.ClusterSecurityGroupId
            - !Ref VsCodeEc2SecurityGroup
      Tags:
        - Key: Name
          Value: vscode
      IamInstanceProfile: !Ref VsCodeEc2InstanceProfile
      UserData:
        # sudo tail -f /var/log/cloud-init-output.log
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -yq
          dnf install -yq git
          dnf groupinstall -yq "Development Tools"

          export VSC_VERSION=$(curl -s https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name | ltrimstr("v")')
          wget https://github.com/coder/code-server/releases/download/v$VSC_VERSION/code-server-$VSC_VERSION-linux-amd64.tar.gz
          tar -xzf code-server-$VSC_VERSION-linux-amd64.tar.gz
          mv code-server-$VSC_VERSION-linux-amd64 /usr/local/lib/code-server
          ln -s /usr/local/lib/code-server/bin/code-server /usr/local/bin/code-server
          mkdir -p /home/ec2-user/.config/code-server
          cat <<EOF > /home/ec2-user/.config/code-server/config.yaml
          bind-addr: 0.0.0.0:8000
          auth: none
          cert: false
          EOF
          chown -R ec2-user:ec2-user /home/ec2-user/.config
          cat <<EOF > /etc/systemd/system/code-server.service
          [Unit]
          Description=VS Code Server
          After=network.target
          [Service]
          Type=simple
          User=ec2-user
          ExecStart=/usr/local/bin/code-server --config /home/ec2-user/.config/code-server/config.yaml /home/ec2-user
          Restart=always
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable code-server
          systemctl start code-server

          sudo -Eu ec2-user bash << 'EOF'
          cd /home/ec2-user
          mkdir -p /home/ec2-user/bin
          curl -O https://s3.us-west-2.amazonaws.com/amazon-eks/1.33.3/2025-08-03/bin/linux/amd64/kubectl
          chmod +x kubectl
          mv kubectl /home/ec2-user/bin/kubectl
          export PATH=/home/ec2-user/bin:$PATH
          echo "export PATH=/home/ec2-user/bin:$PATH" >> ~/.bashrc
          echo "alias k=kubectl" >> ~/.bashrc
          echo "complete -o default -F __start_kubectl k" >> ~/.bashrc
          echo "source <(kubectl completion bash)" >> ~/.bashrc
          exec bash
          aws eks update-kubeconfig --region ${AWS::Region} --name ${EksCluster}

          curl -fsSL -o /home/ec2-user/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
          chmod 700 /home/ec2-user/get_helm.sh
          /home/ec2-user/get_helm.sh
          rm /home/ec2-user/get_helm.sh

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks
          helm install aws-load-balancer-controller eks/aws-load-balancer-controller -n kube-system \
          --set clusterName=${EksCluster} \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set region=${AWS::Region} \
          --set vpcId=${Vpc} \
          --wait
          sleep 60
          EOF

          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource VsCodeEc2 --region ${AWS::Region}
  VsCodeEc2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group
      GroupName: vscode-sg
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        !If [SecurityGroupInboundFromAnywhere, [{
          "IpProtocol": "tcp",
          "FromPort": 8000,
          "ToPort": 8000,
          "CidrIp": "0.0.0.0/0"
        }], []]
      Tags:
        - Key: Name
          Value: vscode-sg
  VsCodeEc2IamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
  VsCodeEc2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref VsCodeEc2IamRole
  VsCodeEc2IamAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName: !Ref EksCluster
      PrincipalArn: !GetAtt VsCodeEc2IamRole.Arn
      Type: STANDARD

  SsmAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - VsCodeEc2 # Required
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 600
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref VsCodeEc2
      Parameters:
        commands:
          - !Sub |
              su - ec2-user << 'SSMEOF'
              export HOME=/home/ec2-user && cd $HOME
              mkdir -p /home/ec2-user/manifests
              cd manifests

              cat << 'EOF' > namespaces.yaml
              apiVersion: v1
              kind: Namespace
              metadata:
                name: tenant-a
                labels:
                  tenant: a
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: tenant-b
                labels:
                  tenant: b
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: management-ui
                labels:
                  role: management-ui
              EOF
              kubectl apply -f namespaces.yaml

              cat << 'EOF' > quotas.yaml
              apiVersion: v1
              kind: ResourceQuota
              metadata:
                name: tenant-quota
                namespace: tenant-a
              spec:
                hard:
                  pods: "20"
                  requests.cpu: "4"
                  requests.memory: 4Gi
                  limits.cpu: "8"
                  limits.memory: 8Gi
              ---
              apiVersion: v1
              kind: LimitRange
              metadata:
                name: tenant-limitrange
                namespace: tenant-a
              spec:
                limits:
                  - type: Container
                    default:
                      cpu: 200m
                      memory: 256Mi
                    defaultRequest:
                      cpu: 100m
                      memory: 128Mi
              ---
              apiVersion: v1
              kind: ResourceQuota
              metadata:
                name: tenant-quota
                namespace: tenant-b
              spec:
                hard:
                  pods: "20"
                  requests.cpu: "4"
                  requests.memory: 4Gi
                  limits.cpu: "8"
                  limits.memory: 8Gi
              ---
              apiVersion: v1
              kind: LimitRange
              metadata:
                name: tenant-limitrange
                namespace: tenant-b
              spec:
                limits:
                  - type: Container
                    default:
                      cpu: 200m
                      memory: 256Mi
                    defaultRequest:
                      cpu: 100m
                      memory: 128Mi
              EOF
              kubectl apply -f quotas.yaml

              for TENANT in tenant-a tenant-b; do
              cat <<EOF > ${!TENANT}-backend.yaml
              apiVersion: v1
              kind: Service
              metadata:
                name: backend
                namespace: ${!TENANT}
                labels:
                  role: backend
              spec:
                ports:
                - port: 6379
                selector:
                  role: backend
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: backend
                namespace: ${!TENANT}
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    role: backend
                template:
                  metadata:
                    labels:
                      role: backend
                  spec:
                    containers:
                    - name: backend
                      image: calico/star-probe:v0.1.0
                      command: 
                      - probe
                      - --http-port=6379
                      - --urls=http://frontend.tenant-a.svc.cluster.local:6379/status,http://frontend.tenant-b.svc.cluster.local:6379/status
                      ports:
                      - containerPort: 6379
              EOF
              cat <<EOF > ${!TENANT}-frontend.yaml
              apiVersion: v1
              kind: Service
              metadata:
                name: frontend
                namespace: ${!TENANT}
                labels:
                  role: frontend
              spec:
                ports:
                - port: 80
                selector:
                  role: frontend
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: frontend
                namespace: ${!TENANT}
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    role: frontend
                template:
                  metadata:
                    labels:
                      role: frontend
                  spec:
                    containers:
                    - name: frontend
                      image: calico/star-probe:v0.1.0
                      command:
                      - probe
                      - --http-port=80
                      - --urls=http://backend.tenant-a.svc.cluster.local:6379/status,http://backend.tenant-b.svc.cluster.local:6379/status
                      ports:
                      - containerPort: 80
              EOF
              kubectl apply -f ${!TENANT}-backend.yaml
              kubectl apply -f ${!TENANT}-frontend.yaml
              done

              cat <<EOF > management-ui.yaml
              apiVersion: v1
              kind: Service
              metadata:
                name: management-ui
                namespace: management-ui
                annotations:
                  service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                  service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                  service.beta.kubernetes.io/aws-load-balancer-security-groups: ${NlbSecurityGroup.GroupId}, ${EksCluster.ClusterSecurityGroupId}
              spec:
                type: LoadBalancer
                ports:
                - port: 80
                  targetPort: 9001
                selector:
                  role: management-ui
              ---
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: probes
                namespace: management-ui
              data:
                probes.json: |
                  [
                    {"id": "FA", "url": "http://frontend.tenant-a.svc.cluster.local:80/status"},
                    {"id": "BA", "url": "http://backend.tenant-a.svc.cluster.local:6379/status"},
                    {"id": "FB", "url": "http://frontend.tenant-b.svc.cluster.local:80/status"},
                    {"id": "BB", "url": "http://backend.tenant-b.svc.cluster.local:6379/status"}
                  ]
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: management-ui
                namespace: management-ui
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    role: management-ui
                template:
                  metadata:
                    labels:
                      role: management-ui
                  spec:
                    containers:
                    - name: management-ui
                      image: calico/star-collect:v0.1.0
                      imagePullPolicy: Always
                      ports:
                      - containerPort: 9001
                      volumeMounts:
                      - name: probes-json
                        mountPath: /star/probes.json
                        subPath: probes.json
                        readOnly: true
                    volumes:
                    - name: probes-json
                      configMap:
                        name: probes
              EOF
              kubectl apply -f management-ui.yaml

              for TENANT in tenant-a tenant-b; do
              echo 'kind: NetworkPolicy
              apiVersion: networking.k8s.io/v1
              metadata:
                name: default-deny
              spec:
                podSelector:
                  matchLabels: {}' | kubectl apply -n ${!TENANT} -f -

              echo 'kind: NetworkPolicy
              apiVersion: networking.k8s.io/v1
              metadata:
                name: allow-ui
              spec:
                podSelector:
                  matchLabels: {}
                ingress:
                  - from:
                      - namespaceSelector:
                          matchLabels:
                            role: management-ui' | kubectl apply -n ${!TENANT} -f -

              echo 'kind: NetworkPolicy
              apiVersion: networking.k8s.io/v1
              metadata:
                name: backend-policy
              spec:
                podSelector:
                  matchLabels:
                    role: backend
                ingress:
                  - from:
                      - podSelector:
                          matchLabels:
                            role: frontend
                    ports:
                      - protocol: TCP
                        port: 6379' | kubectl apply -n ${!TENANT} -f -
              done

              echo "# EKS Soft Multi-tenancy

              ## tenant-a frontend -> tenant-a backend (expected: allowed)
              FRONTENT_A=$(kubectl get pod -n tenant-a -l role=frontend -o jsonpath='{.items[*].metadata.name}')
              kubectl exec -n tenant-a $FRONTENT_A -- probe --http-port=81 --urls=http://backend.tenant-a.svc.cluster.local:6379/status

              ## tenant-a frontend -> tenant-b backend (expected: blocked/timeout)
              FRONTENT_A=$(kubectl get pod -n tenant-a -l role=frontend -o jsonpath='{.items[*].metadata.name}')
              kubectl exec -n tenant-a $FRONTENT_A -- probe --http-port=82 --urls=http://backend.tenant-b.svc.cluster.local:6379/status

              ## tenant-b frontend -> tenant-b backend (expected: allowed)
              FRONTENT_B=$(kubectl get pod -n tenant-b -l role=frontend -o jsonpath='{.items[*].metadata.name}')
              kubectl exec -n tenant-b $FRONTENT_B -- probe --http-port=81 --urls=http://backend.tenant-b.svc.cluster.local:6379/status

              ## tenant-b frontend -> tenant-a backend (expected: blocked/timeout)
              FRONTENT_B=$(kubectl get pod -n tenant-b -l role=frontend -o jsonpath='{.items[*].metadata.name}')
              kubectl exec -n tenant-b $FRONTENT_B -- probe --http-port=82 --urls=http://backend.tenant-a.svc.cluster.local:6379/status

              ## management-ui service
              curl http://${ManagementUiNlb.DNSName}
              
              " > /home/ec2-user/README.md
              SSMEOF

