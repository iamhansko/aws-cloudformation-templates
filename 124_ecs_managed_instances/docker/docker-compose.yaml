services:
  shlink:
    image: shlinkio/shlink:4.4.6
    container_name: shlink
    restart: unless-stopped
    ports:
      - "${SHLINK_PORT:-8080}:8080"
    environment:
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:8080}
      IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED:-false}
      INITIAL_API_KEY: ${SHLINK_API_KEY:?SHLINK_API_KEY를 .env에 설정하세요}
      TIMEZONE: ${TIMEZONE:-Asia/Seoul}
      GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY:-}
    volumes:
      - shlink_data:/etc/shlink/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/rest/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
  shlink-web-client:
    image: shlinkio/shlink-web-client:4.4.0
    container_name: shlink-web-client
    restart: unless-stopped
    ports:
      - "${WEB_CLIENT_PORT:-8000}:8080"
    environment:
      SHLINK_SERVER_URL: ${SHLINK_SERVER_URL:-http://localhost:8080}
      SHLINK_SERVER_API_KEY: ${SHLINK_API_KEY}
      SHLINK_SERVER_NAME: ${SHLINK_SERVER_NAME:-Shlink}
    depends_on:
      shlink:
        condition: service_healthy
volumes:
  shlink_data: