  VpcAEc2SsmAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - VpcAEc2 # Required
    Properties:
      Name: AWS-RunShellScript
      WaitForSuccessTimeoutSeconds: 600
      Targets:
        - Key: InstanceIds
          Values:
            - Ref: !Sub VpcAEc2
      Parameters:
        commands: 
          # uid=0(root) gid=0(root) groups=0(root) context=system_u:system_r:unconfined_service_t:s0
          - !Sub |
              su - ec2-user << 'SSMEOF'
              export HOME=/home/ec2-user
              cd $HOME

              curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
              sudo mv /tmp/eksctl /usr/local/bin

              curl -fsSL -o /home/ec2-user/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
              chmod 700 /home/ec2-user/get_helm.sh
              /home/ec2-user/get_helm.sh
              rm /home/ec2-user/get_helm.sh

              helm repo add eks https://aws.github.io/eks-charts
              helm repo update eks
              helm install aws-load-balancer-controller eks/aws-load-balancer-controller -n kube-system --wait \
              --set clusterName=${VpcAEksCluster} \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set region=${AWS::Region} \
              --set vpcId=${VpcA}
              sleep 60

              mkdir -p /home/ec2-user/manifests
              echo 'apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nginx
              spec:
                selector:
                  matchLabels:
                    app: nginx
                replicas: 5
                template:
                  metadata:
                    labels:
                      app: nginx
                  spec:
                    containers:
                    - image: nginx:latest
                      imagePullPolicy: Always
                      name: nginx
                      ports:
                      - containerPort: 80
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: nginx
              spec:
                ports:
                  - port: 80
                    targetPort: 80
                    protocol: TCP
                type: ClusterIP
                selector:
                  app: nginx
              ---
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: nginx
                annotations:
                  alb.ingress.kubernetes.io/scheme: internet-facing
                  alb.ingress.kubernetes.io/target-type: ip
                  alb.ingress.kubernetes.io/security-groups: ${VpcAAlbSecurityGroup}
                  alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
              spec:
                ingressClassName: alb
                rules:
                  - http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: nginx
                            port:
                              number: 80' > /home/ec2-user/manifests/web.yaml
              kubectl apply -f /home/ec2-user/manifests/web.yaml
              SSMEOF
  
  VpcBEc2SsmAssociation:
      Type: AWS::SSM::Association
      DependsOn:
        - VpcBEc2 # Required
      Properties:
        Name: AWS-RunShellScript
        WaitForSuccessTimeoutSeconds: 600
        Targets:
          - Key: InstanceIds
            Values:
              - Ref: !Sub VpcBEc2
        Parameters:
          commands: 
            # uid=0(root) gid=0(root) groups=0(root) context=system_u:system_r:unconfined_service_t:s0
            - !Sub |
                su - ec2-user << 'SSMEOF'
                export HOME=/home/ec2-user
                cd $HOME

                curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
                sudo mv /tmp/eksctl /usr/local/bin

                curl -fsSL -o /home/ec2-user/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
                chmod 700 /home/ec2-user/get_helm.sh
                /home/ec2-user/get_helm.sh
                rm /home/ec2-user/get_helm.sh

                helm repo add eks https://aws.github.io/eks-charts
                helm repo update eks
                helm install aws-load-balancer-controller eks/aws-load-balancer-controller -n kube-system --wait \
                --set clusterName=${VpcBEksCluster} \
                --set serviceAccount.name=aws-load-balancer-controller \
                --set region=${AWS::Region} \
                --set vpcId=${VpcB}
                sleep 60

                mkdir -p /home/ec2-user/manifests
                echo 'apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: nginx
                spec:
                  selector:
                    matchLabels:
                      app: nginx
                  replicas: 5
                  template:
                    metadata:
                      labels:
                        app: nginx
                    spec:
                      containers:
                      - image: nginx:latest
                        imagePullPolicy: Always
                        name: nginx
                        ports:
                        - containerPort: 80
                ---
                apiVersion: v1
                kind: Service
                metadata:
                  name: nginx
                spec:
                  ports:
                    - port: 80
                      targetPort: 80
                      protocol: TCP
                  type: ClusterIP
                  selector:
                    app: nginx
                ---
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: nginx
                  annotations:
                    alb.ingress.kubernetes.io/scheme: internal
                    alb.ingress.kubernetes.io/target-type: ip
                    alb.ingress.kubernetes.io/security-groups: ${VpcBAlbSecurityGroup}
                    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
                spec:
                  ingressClassName: alb
                  rules:
                    - http:
                        paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: nginx
                              port:
                                number: 80' > /home/ec2-user/manifests/web.yaml
                kubectl apply -f /home/ec2-user/manifests/web.yaml
                SSMEOF
  
  VpcAAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: 
        - !Ref VpcAPublicSubneta
        - !Ref VpcAPublicSubnetc
      SecurityGroups:
        - !GetAtt VpcA.DefaultSecurityGroup # Ignored
      Tags: 
        - Key: elbv2.k8s.aws/cluster
          Value: !Ref VpcAEksCluster
        - Key: ingress.k8s.aws/resource
          Value: LoadBalancer
        - Key: ingress.k8s.aws/stack
          Value: default/nginx
  VpcAAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group
      GroupName: vpc-a-alb-sg
      SecurityGroupIngress:
        - !If [SecurityGroupInboundFromAnywhere, {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          }, !Ref AWS::NoValue]
      VpcId: !Ref VpcA
      Tags:
        - Key: Name
          Value: vpc-a-alb-sg
  
  VpcBAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets: 
        - !Ref VpcBPrivateSubneta
        - !Ref VpcBPrivateSubnetc
      SecurityGroups:
        - !GetAtt VpcB.DefaultSecurityGroup # Ignored
      Tags: 
        - Key: elbv2.k8s.aws/cluster
          Value: !Ref VpcBEksCluster
        - Key: ingress.k8s.aws/resource
          Value: LoadBalancer
        - Key: ingress.k8s.aws/stack
          Value: default/nginx
  VpcBAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group
      GroupName: vpc-b-alb-sg
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !GetAtt VpcA.CidrBlock
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !GetAtt VpcB.CidrBlock
      VpcId: !Ref VpcB
      Tags:
        - Key: Name
          Value: vpc-b-alb-sg


Outputs:
  VpcAEc2:
    Value: !Sub http://${VpcAEc2.PublicIp}:8000
    Description: Public IP Address of the VS Code (VPC A)
  VpcBEc2:
    Value: !Sub http://${VpcBEc2.PublicIp}:8000
    Description: Public IP Address of the VS Code (VPC B)